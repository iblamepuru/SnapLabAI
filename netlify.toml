# Netlify configuration for SnapLab AI
# Publishes the static web app in the 'site' folder with full SPA fallback and headers

[build]
  publish = "site"

# Ensure all client-side routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache-control headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"

# Static asset caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
